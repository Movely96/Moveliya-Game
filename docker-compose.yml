# Moveliya Game - cross-platform lab (Windows / macOS / Linux) via Docker.
#
#   docker compose up --build
#
# Builds both containers locally from this repo (no external images needed).
# Then, from your host machine, treat these two containers as the "lab VM":
#   - Web portal : http://localhost:8080  (start at /gce/home.php, robots.txt at /robots.txt)
#   - SSH host   : ssh <user>@localhost -p 2222   (nmap/hydra target: localhost -p 2222)
#
# Everything runs locally and offline. Same accounts, credentials and flag as
# the original Ubuntu VM setup.
services:
  web:
    build: ./web
    container_name: moveliya-web
    ports:
      - "8080:80"
    restart: unless-stopped

  ssh:
    build: ./ssh
    container_name: moveliya-ssh
    ports:
      - "2222:22"
    restart: unless-stopped
