# Moveliya Game - cross-platform lab (Windows / macOS / Linux) via Docker.
#
#   docker compose up --build
#
# Builds both containers locally from this repo (no external images needed).
# From your host machine, treat these two containers as the "lab VM":
#   - Web portal : http://localhost:8080   (find the portal through recon: robots.txt)
#   - SSH host   : ssh <user>@localhost -p 2222   (nmap/hydra target: localhost -p 2222)
#
# Ports are bound to 127.0.0.1 ONLY, so the lab (which has deliberately weak
# SSH passwords) is not reachable by other devices on your network.
# To let players connect from other machines, change "127.0.0.1:" to "0.0.0.0:"
# on purpose, and only on a network you trust.
services:
  web:
    build: ./web
    container_name: moveliya-web
    ports:
      - "127.0.0.1:8080:80"
    restart: "no"

  ssh:
    build: ./ssh
    container_name: moveliya-ssh
    ports:
      - "127.0.0.1:2222:22"
    restart: "no"
